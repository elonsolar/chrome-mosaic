<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mosaic Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/dashboard.css?v=3">
  <link rel="stylesheet" href="../styles/models-tab.css?v=2">
</head>
<body>
  <div class="dashboard-layout">
    <!-- 左侧导航 -->
    <nav class="dashboard-sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">
            <svg class="sidebar-logo-icon" width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="grad1-sm-chat" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
                  <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="grad2-sm-chat" x1="100%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
                  <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
                </linearGradient>
              </defs>
              <rect width="22" height="22" rx="6" fill="#1a1a2e"/>
              <rect x="2" y="2" width="8" height="8" rx="2" fill="url(#grad1-sm-chat)"/>
              <rect x="12" y="2" width="8" height="8" rx="2" fill="url(#grad2-sm-chat)"/>
              <rect x="2" y="12" width="8" height="8" rx="2" fill="#4facfe"/>
              <rect x="12" y="12" width="8" height="8" rx="2" fill="#43e97b"/>
              <path d="M11 5C11 5 12 10 15.5 11C12 12 11 17 11 17C11 17 10 12 6.5 11C10 10 11 5 11 5Z" fill="white" opacity="0.9"/>
            </svg>
            <span class="sidebar-logo-text">Mosaic</span>
          </div>
        <p class="sidebar-subtitle"></p>
      </div>

      <div class="sidebar-nav">
        <a href="#prompts" class="nav-item active" data-page="prompts">
          <span class="nav-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
          </span>
          <span class="nav-label">提示词</span>
        </a>

        <a class="nav-item" href="#models" data-page="models">
          <span class="nav-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
              <polyline points="3.27 6.96 12 12.01 20.73 6.96"/>
              <line x1="12" y1="22.08" x2="12" y2="12"/>
            </svg>
          </span>
          <span class="nav-label">模型</span>
        </a>
        <a class="nav-item" href="#experts" data-page="experts">
          <span class="nav-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
            </svg>
          </span>
          <span class="nav-label">专家</span>
        </a>
        <a href="#settings" class="nav-item" data-page="settings">
          <span class="nav-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </span>
          <span class="nav-label">设置</span>
        </a>
      </div>

      <div class="sidebar-footer">
        <button class="sidebar-footer-btn" id="backToChatBtn" title="返回对话">
          <div class="sidebar-footer-avatar">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M2.99997 8.00001C2.99997 8.18959 3.07927 8.37081 3.21954 8.50001L6.96954 11.87C7.26244 12.1334 7.71328 12.11 7.97669 11.8171C8.2401 11.5242 8.21669 11.0734 7.92379 10.81L5.44354 8.60001H12.3333C12.7359 8.60001 13.0622 8.30453 13.0622 7.94001C13.0622 7.57549 12.7359 7.28001 12.3333 7.28001H5.44354L7.92379 5.07001C8.21669 4.80666 8.2401 4.35582 7.97669 4.06292C7.71328 3.77002 7.26244 3.7466 6.96954 4.01001L3.21954 7.38001C3.07927 7.50921 2.99997 7.69043 2.99997 7.88001V8.00001Z" fill="currentColor"/></svg>
          </div>
          <span class="sidebar-footer-name">返回对话</span>
          <svg class="sidebar-footer-arrow" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path fill-rule="evenodd" clip-rule="evenodd" d="M12.9999 8.00001C12.9999 7.81044 12.9206 7.62921 12.7803 7.50001L9.03032 4.13001C8.73742 3.86659 8.28658 3.89001 8.02317 4.18292C7.75976 4.47582 7.78317 4.92666 8.07608 5.19001L10.5563 7.40001H3.66657C3.26396 7.40001 2.93768 7.69549 2.93768 8.06001C2.93768 8.42454 3.26396 8.72001H3.66657 8.72001H10.5563L8.07608 10.93C7.78317 11.1934 7.75976 11.6442 8.02317 11.9371C8.28658 12.23 8.73742 12.2534 9.03032 11.99L12.7803 8.62001C12.9206 8.49081 12.9999 8.30959 12.9999 8.12001V8.00001Z" fill="currentColor"></path></svg>
        </button>
      </div>
    </nav>

    <main class="main-content">
      <!-- 页面内容区域 -->
      <div class="page-content-wrapper">
        <!-- 专家管理页面 -->
        <div class="page-content" id="page-experts">
        <div class="experts-container-wrapper">
          <div class="page-toolbar">
            <div class="page-toolbar-left">
              <div class="search-box">
                <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="11" cy="11" r="8"></circle>
                  <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" id="expertSearchInput" placeholder="搜索专家...">
                <button class="clear-btn" id="clearExpertSearch" style="display: none;">&times;</button>
              </div>
            </div>
            <div class="page-toolbar-right">
              <button class="btn btn-primary" id="createExpertBtn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <line x1="12" y1="5" x2="12" y2="19"></line>
                  <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
                <span>新增专家</span>
              </button>
              <div class="view-toggle" id="expertsViewToggle">
                <button class="view-btn" data-view="list" title="列表视图">
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <rect x="2" y="3" width="12" height="2" rx="1"/>
                    <rect x="2" y="7" width="12" height="2" rx="1"/>
                    <rect x="2" y="11" width="12" height="2" rx="1"/>
                  </svg>
                </button>
                <button class="view-btn active" data-view="grid" title="网格视图">
                  <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                    <rect x="2" y="2" width="5" height="5" rx="1"/>
                    <rect x="9" y="2" width="5" height="5" rx="1"/>
                    <rect x="2" y="9" width="5" height="5" rx="1"/>
                    <rect x="9" y="9" width="5" height="5" rx="1"/>
                  </svg>
                </button>
              </div>
            </div>
          </div>

          <div class="experts-container" id="expertsContainer">
          </div>
        </div>
      </div>

      <!-- 提示词管理页面 -->
      <div class="page-content" id="page-prompts">
        <iframe src="components/prompts.html" class="page-iframe" id="promptsIframe"></iframe>
      </div>

      <!-- 模型管理页面 -->
      <div class="page-content" id="page-models">
        <div id="modelsTabContainer"></div>
      </div>

      <div class="page-content" id="page-settings">
        <div class="settings-page">
          <div class="settings-sections">
            <!-- 主题设置 -->
            <div class="settings-section">
              <div class="settings-section-header">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="5"/>
                  <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                </svg>
                <h3>主题设置</h3>
              </div>

              <div class="settings-card">
                <div class="setting-row setting-row-theme-toggle">
                  <div class="setting-info">
                    <label class="setting-label">界面主题</label>
                    <p class="setting-hint">切换亮色/深色模式</p>
                  </div>
                  <button class="btn btn-secondary" id="themeToggleBtn">
                    <svg class="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                      <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/>
                      <path d="M12 2V4M12 20V22M4.22 4.22L5.64 5.64M18.36 18.36L19.78 19.78M2 12H4M20 12H22M4.22 19.78L5.64 18.36M18.36 5.64L19.78 4.22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                    <svg class="theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none;">
                      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span id="themeLabel">亮色模式</span>
                  </button>
                </div>
              </div>
            </div>

            <!-- 服务器设置 -->
            <div class="settings-section">
              <div class="settings-section-header">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="2" y="2" width="20" height="8" rx="2" ry="2"/>
                  <rect x="2" y="14" width="20" height="8" rx="2" ry="2"/>
                  <line x1="6" y1="6" x2="6.01" y2="6"/>
                  <line x1="6" y1="18" x2="6.01" y2="18"/>
                </svg>
                <h3>服务器设置</h3>
              </div>

              <div class="settings-card">
                <div class="setting-row">
                  <div class="setting-info">
                    <label class="setting-label" for="wsUrlInput">WebSocket 服务器地址</label>
                    <p class="setting-hint">插件将连接到此服务器，外部客户端通过同一服务器与插件通信</p>
                  </div>
                  <input type="text" class="setting-input" id="wsUrlInput" placeholder="ws://localhost:12606" />
                </div>

                <div class="setting-row">
                  <div class="setting-info">
                    <label class="setting-label" for="wsEnabledCheckbox">启用 WebSocket 连接</label>
                    <p class="setting-hint">开启后插件将自动连接服务器，允许外部客户端访问会话和发送消息</p>
                  </div>
                  <label class="switch">
                    <input type="checkbox" id="wsEnabledCheckbox" role="switch" aria-label="启用 WebSocket 连接">
                    <span class="slider"></span>
                  </label>
                </div>

                <div class="setting-row setting-row-status">
                  <div class="setting-info">
                    <label class="setting-label">连接状态</label>
                    <p class="setting-hint">实时显示 WebSocket 连接情况</p>
                  </div>
                  <div class="ws-status-badge" id="wsStatusBadge">
                    <span class="status-dot" id="wsStatusDot"></span>
                    <span class="status-label" id="wsStatusLabel">未连接</span>
                  </div>
                </div>
              </div>
            </div>

            <!-- 消息设置 -->
            <div class="settings-section">
              <div class="settings-section-header">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <h3>消息设置</h3>
              </div>

              <div class="settings-card">
                <div class="setting-row">
                  <div class="setting-info">
                    <label class="setting-label" for="floatWindowCheck">浮动窗口</label>
                    <p class="setting-hint">在当前页面显示 AI 回复，不切换标签页</p>
                  </div>
                  <label class="switch">
                    <input type="checkbox" id="floatWindowCheck" checked role="switch" aria-label="启用浮动窗口">
                    <span class="slider"></span>
                  </label>
                </div>
              </div>
            </div>

            <!-- 辅助功能 -->
            <div class="settings-section">
              <div class="settings-section-header">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="3"/>
                  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
                </svg>
                <h3>辅助功能</h3>
              </div>

              <div class="settings-card">
                <div class="setting-row">
                  <div class="setting-info">
                    <label class="setting-label" for="helperModelSelect">辅助模型</label>
                    <p class="setting-hint">用于会话标题生成、提示词优化等系统辅助功能</p>
                  </div>
                  <select class="setting-select" id="helperModelSelect">
                    <option value="">请选择模型</option>
                  </select>
                </div>
              </div>
            </div>

          </div>

          <div class="settings-footer">
            <p class="settings-footer-text">Mosaic · 多 AI 协作对话平台</p>
          </div>
        </div>
      </div>
      </div>
    </main>
  </div>

  <!-- 会话创建模态框 -->
  <div class="modal" id="conversationModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>新建会话</h2>
        <button class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <form id="conversationForm">
          <div class="form-group">
            <label for="conversationName">会话名称</label>
            <input type="text" id="conversationName" class="form-input"
                   placeholder="输入会话名称（可选）" autocomplete="off">
            <small class="form-hint">留空则自动生成标题</small>
          </div>

          <div class="form-group">
            <label>对话模式</label>
            <div class="mode-selector" id="convModeSelector">
              <label class="mode-option">
                <input type="radio" name="convMode" value="brainstorming" checked>
                <div class="mode-card">
                  <div class="mode-icon">💡</div>
                  <div class="mode-title">头脑风暴</div>
                  <div class="mode-desc">独享上下文 · 并行回复</div>
                </div>
              </label>
              <label class="mode-option">
                <input type="radio" name="convMode" value="discussion">
                <div class="mode-card">
                  <div class="mode-icon">🪑</div>
                  <div class="mode-title">圆桌讨论</div>
                  <div class="mode-desc">共享上下文 · 依次发言</div>
                </div>
              </label>
              <label class="mode-option">
                <input type="radio" name="convMode" value="expertqa">
                <div class="mode-card">
                  <div class="mode-icon">🎓</div>
                  <div class="mode-title">专家问答</div>
                  <div class="mode-desc">多AI协作 · 迭代求解</div>
                </div>
              </label>
            </div>
          </div>

          <!-- 专家选择区 (expertqa 模式) -->
          <div class="form-group" id="convExpertGroup" style="display:none;">
            <label>选择专家</label>
            <div id="convExpertSelector" class="expert-selector"></div>
          </div>

          <!-- 成员选择区 (brainstorming / discussion 模式) -->
          <div class="form-group" id="convMemberGroup">
            <div class="member-actions-header">
              <label>会话成员 <span style="color: #ff3b30;">*</span></label>
              <button type="button" class="btn-link" id="convAddMemberBtn">
                <span class="btn-icon">+</span> 创建新成员
              </button>
            </div>
            <div class="members-selector" id="convModelSelector">
              <div class="empty-state" style="padding: 16px; text-align: center; color: #86868b;">
                <p style="margin: 0; font-size: 13px;">正在加载模型...</p>
              </div>
            </div>

          </div>

          <!-- 内联创建成员表单 -->
          <div class="inline-form-container" id="convInlineMemberForm" style="display:none;">
            <div class="inline-form-body">
              <div class="form-group">
                <label for="convNewMemberName">成员名称 <span style="color: #ff3b30;">*</span></label>
                <input type="text" id="convNewMemberName" class="form-input"
                       placeholder="例如：Python 专家助手" autocomplete="off">
              </div>
              <div class="form-group">
                <label for="convNewMemberModel">选择模型 <span style="color: #ff3b30;">*</span></label>
                <select id="convNewMemberModel" class="form-select">
                  <option value="">请选择模型...</option>
                </select>
              </div>
              <div class="form-group">
                <label for="convNewMemberPrompt">选择提示词 <span class="optional">(可选)</span></label>
                <select id="convNewMemberPrompt" class="form-select">
                  <option value="">无提示词</option>
                </select>
              </div>
              <div class="inline-form-actions">
                <button type="button" class="btn btn-secondary" id="convCancelInlineBtn">取消</button>
                <button type="button" class="btn btn-primary" id="convSaveInlineBtn">
                  <span>✨</span> 创建并添加
                </button>
              </div>
            </div>
          </div>

          <!-- 圆桌讨论发言顺序已整合到成员列表中 -->
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelConversationBtn">取消</button>
        <button class="btn btn-primary" id="confirmConversationBtn">
          <span>💬</span> 开始对话
        </button>
      </div>
    </div>
  </div>

  <!-- 专家创建/编辑模态框 -->
  <div class="modal" id="expertModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="expertModalTitle">新建专家</h2>
        <button class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="expert-modal-avatar-preview">
          <div class="expert-preview-avatar" id="expertAvatarPreview">
            <img src="../avatars/Expert.svg" alt="预览">
          </div>
          <button class="btn btn-secondary btn-sm" id="refreshAvatarBtn" title="换一个头像">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
