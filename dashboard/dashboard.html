<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free AI - 管理面板</title>
  <link rel="stylesheet" href="../styles/dashboard.css">
</head>
<body>
  <div class="dashboard-layout">
    <!-- 左侧导航 -->
    <nav class="dashboard-sidebar">
      <div class="sidebar-header">
        <h1 class="sidebar-title">Free AI</h1>
        <p class="sidebar-subtitle">管理面板</p>
      </div>

      <div class="sidebar-nav">
        <a href="#home" class="nav-item active" data-page="home">
          <span class="nav-icon">🏠</span>
          <span class="nav-label">首页</span>
        </a>
        <a href="#teams" class="nav-item" data-page="teams">
          <span class="nav-icon">👥</span>
          <span class="nav-label">团队</span>
        </a>
        <a href="#conversations" class="nav-item" data-page="conversations">
          <span class="nav-icon">💬</span>
          <span class="nav-label">会话</span>
        </a>
        <a href="#prompts" class="nav-item" data-page="prompts">
          <span class="nav-icon">📝</span>
          <span class="nav-label">角色</span>
        </a>

        <a class="nav-item" href="#models" data-page="models">
          <span class="nav-icon">🤖</span>
          <span class="nav-label">模型</span>
        </a>
        <a href="#settings" class="nav-item" data-page="settings">
          <span class="nav-icon">⚙️</span>
          <span class="nav-label">设置</span>
        </a>
      </nav>
    </aside>

    <main class="main-content">
      <!-- 首页 -->
      <div class="page-content active" id="page-home">
        <div class="page-header">
          <h2>控制台</h2>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon">💬</div>
            <div class="stat-info">
              <div class="stat-value" id="statConversations">0</div>
              <div class="stat-label">会话数量</div>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon">👥</div>
            <div class="stat-info">
              <div class="stat-value" id="statTeams">0</div>
              <div class="stat-label">团队数量</div>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon">🤖</div>
            <div class="stat-info">
              <div class="stat-value" id="statModels">0</div>
              <div class="stat-label">模型数量</div>
            </div>
          </div>

          <div class="stat-card">
            <div class="stat-icon">🎭</div>
            <div class="stat-info">
              <div class="stat-value" id="statPrompts">0</div>
              <div class="stat-label">角色数量</div>
            </div>
          </div>
        </div>

        <div class="quick-actions">
          <h3 class="section-title">快捷操作</h3>
          <div class="quick-actions-grid">
            <button class="quick-action-btn" id="quickCreateTeamBtn">
              <span class="action-icon">👥</span>
              <span class="action-label">创建团队</span>
            </button>

            <button class="quick-action-btn" id="quickCreatePromptBtn">
              <span class="action-icon">🎭</span>
              <span class="action-label">创建角色</span>
            </button>
          </div>
        </div>
      </div>

      <!-- 团队管理页面 -->
      <div class="page-content" id="page-teams">
        <div class="page-header-simple">
          <h2>团队管理</h2>
        </div>

        <div class="teams-container" id="teamsContainer">
          <div class="loading-skeleton-grid">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
          </div>
        </div>

        <!-- 浮动操作按钮 -->
        <div class="fab-container" id="teamsFab">
          <button class="fab fab-main" data-page="teams">
            <svg class="fab-icon fab-icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
          <div class="fab-actions">
            <button class="fab fab-action" data-action="createTeam">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                <circle cx="9" cy="7" r="4"></circle>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
              </svg>
              </button>
          </div>
        </div>
      </div>

      <!-- 会话管理页面 -->
      <div class="page-content" id="page-conversations">
        <div class="page-header-simple">
          <h2>会话管理</h2>
        </div>

        <!-- 过滤器 -->
        <div class="conversations-filters" id="conversationsFilters">
          <div class="filter-row">
            <!-- 搜索框 -->
            <div class="filter-item search-box">
              <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.5"/>
                <path d="M11 11L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
              <input type="text" placeholder="搜索会话名称..." id="conversationSearchInput">
              <button class="clear-btn" id="clearSearchBtn" style="display: none;">×</button>
            </div>
            
            <!-- 日期筛选 -->
            <div class="filter-item">
              <select id="conversationDateFilter" class="filter-select">
                <option value="all">全部时间</option>
                <option value="today">今天</option>
                <option value="week">最近7天</option>
                <option value="month">最近30天</option>
              </select>
            </div>
            
            <!-- 模型筛选 -->
            <div class="filter-item">
              <select id="conversationModelFilter" class="filter-select">
                <option value="all">全部模型</option>
              </select>
            </div>
            
            <!-- 排序 -->
            <div class="filter-item">
              <select id="conversationSortBy" class="filter-select">
                <option value="updatedAt">最近更新</option>
                <option value="createdAt">创建时间</option>
                <option value="name">名称</option>
                <option value="messagesCount">消息数</option>
              </select>
              <button class="sort-toggle" id="sortOrderBtn" title="切换排序顺序">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
                  <path d="M7 3L7 11M7 3L4 6M7 3L10 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
          </div>
          
          <!-- 活跃筛选标签 -->
          <div class="active-filters" id="activeFilters"></div>
          
          <!-- 结果统计 -->
          <div class="filter-stats" id="filterStats" style="display: none;">
            找到 <strong id="filteredCount">0</strong> 个会话
            <button class="btn-link clear-all-filters" id="clearAllFiltersBtn" style="display: none;">清除全部筛选</button>
          </div>
        </div>

        <!-- 批量操作栏 -->
        <div class="batch-operations-bar" id="batchOperationsBar" style="display: none;">
          <div class="batch-info">
            <input type="checkbox" id="selectAllCheckbox" class="select-all-checkbox">
            <span class="batch-count">已选择 <strong id="selectedCount">0</strong> 个会话</span>
          </div>
          
          <div class="batch-actions">
            <button class="btn btn-secondary batch-btn" id="batchExportBtn" title="导出会话">
              <span>📥</span> 导出
            </button>
            <button class="btn btn-secondary batch-btn" id="batchDeleteBtn" title="删除会话">
              <span>🗑️</span> 删除
            </button>
            <button class="btn btn-link batch-btn" id="cancelSelectionBtn">取消选择</button>
          </div>
        </div>

        <div class="conversations-container" id="conversationsContainer">
          <!-- 内容由 JS 动态渲染 -->
        </div>

        <!-- 会话详情视图 -->
        <div class="conversation-detail-view" id="conversationDetailView" style="display: none;">
          <div class="detail-header">
            <button class="btn-back" id="backToConversationsBtn">
              <span>←</span> 返回列表
            </button>
            <div class="detail-title">
              <h2 id="detailConversationName">会话名称</h2>
              <div class="detail-meta">
                <span id="detailModels">模型1, 模型2</span>
                <span id="detailTime">2小时前</span>
              </div>
            </div>
            <div class="detail-actions">
              <button class="btn btn-secondary" id="continueConversationBtn">
                <span>💬</span> 继续对话
              </button>
              <button class="btn btn-secondary" id="exportSingleConversationBtn">
                <span>📥</span> 导出
              </button>
            </div>
          </div>

          <div class="detail-content">
            <div class="messages-list" id="detailMessagesList">
              <!-- 消息列表 -->
            </div>
          </div>
        </div>

        <!-- 浮动操作按钮 -->
        <div class="fab-container" id="conversationsFab">
          <button class="fab fab-main" data-page="conversations">
            <svg class="fab-icon fab-icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
          <div class="fab-actions">
            <button class="fab fab-action" data-action="createConversation">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
              </svg>
              </button>
            <button class="fab fab-action" data-action="openSidepanel">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="9" y1="3" x2="9" y2="21"></line>
              </svg>
              </button>
          </div>
        </div>
      </div>

      <!-- 角色管理页面 -->
      <div class="page-content" id="page-prompts">
        <iframe src="../sidepanel/tabs/prompts.html" class="page-iframe" id="promptsIframe"></iframe>

        <!-- 浮动操作按钮 -->
        <div class="fab-container" id="promptsFab">
          <button class="fab fab-main" data-page="prompts">
            <svg class="fab-icon fab-icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
          <div class="fab-actions">
            <button class="fab fab-action" onclick="document.getElementById('promptsIframe').contentWindow.postMessage({action: 'createPrompt'}, '*')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
              </svg>
              </button>
            <button class="fab fab-action" onclick="document.getElementById('promptsIframe').contentWindow.postMessage({action: 'importPrompts'}, '*')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              </button>
            <button class="fab fab-action" onclick="document.getElementById('promptsIframe').contentWindow.postMessage({action: 'exportPrompts'}, '*')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
              </button>
          </div>
        </div>
      </div>

      <!-- 模型管理页面 -->
      <div class="page-content" id="page-models">
        <iframe src="../sidepanel/tabs/models.html" class="page-iframe"></iframe>

        <!-- 浮动操作按钮 -->
        <div class="fab-container" id="modelsFab">
          <button class="fab fab-main" data-page="models">
            <svg class="fab-icon fab-icon-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </button>
          <div class="fab-actions">
            <button class="fab fab-action" onclick="document.getElementById('modelsIframe').contentWindow.postMessage({action: 'createModel'}, '*')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
              </svg>
              </button>
            <button class="fab fab-action" onclick="document.getElementById('modelsIframe').contentWindow.postMessage({action: 'importModels'}, '*')">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
              </svg>
              </button>
          </div>
        </div>
      </div>

      <!-- 设置页面 -->
      <div class="page-content" id="page-settings">
        <iframe src="../sidepanel/sidepanel.html#settings" class="page-iframe"></iframe>
      </div>
    </main>
  </div>

  <!-- 团队表单模态框 -->
  <div class="modal" id="teamModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="teamModalTitle">新建团队</h2>
        <button class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <form id="teamForm">
          <div class="form-group">
            <label for="teamName">
              团队名称 <span style="color: #ff3b30;">*</span>
            </label>
            <input type="text" id="teamName" class="form-input"
                   placeholder="例如：开发顾问团" autocomplete="off">
            <small class="form-hint">为团队设置一个易于识别的名称</small>
          </div>

          <div class="form-group">
            <label for="teamDescription">
              团队描述
            </label>
            <textarea id="teamDescription" class="form-textarea" rows="3"
                      placeholder="描述团队的用途和特点（可选）"></textarea>
            <small class="form-hint">简要说明这个团队的用途</small>
          </div>

          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
              <label style="margin: 0;">
                团队成员 <span style="color: #ff3b30;">*</span>
              </label>
              <button type="button" class="btn-link" id="addTeamMemberBtn" style="padding: 4px 8px; font-size: 13px;">
                <span style="font-size: 16px;">+</span> 新增成员
              </button>
            </div>

            <!-- 成员列表 -->
            <div class="team-members-list" id="teamMembersList">
              <div class="empty-state" style="padding: 24px; text-align: center; color: #86868b;">
                <div style="font-size: 32px; margin-bottom: 8px;">👥</div>
                <p style="margin: 0; font-size: 13px;">暂无成员，点击上方按钮添加</p>
              </div>
            </div>

            <!-- 内联成员创建表单（默认隐藏） -->
            <div class="inline-member-form" id="inlineMemberForm" style="display: none;">
              <div style="background: #f9f9fb; border: 2px solid #e8e8ed; border-radius: 12px; padding: 16px; margin-top: 12px;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                  <span style="font-weight: 600; color: #1d1d1f; font-size: 14px;">🆕 新建成员</span>
                  <button type="button" class="btn-link" id="cancelInlineMemberBtn" style="padding: 4px 8px; color: #86868b;">取消</button>
                </div>

                <div style="display: grid; gap: 12px;">
                  <div>
                    <label style="font-size: 12px; font-weight: 500; color: #1d1d1f; margin-bottom: 6px; display: block;">
                      选择角色 <span style="color: #ff3b30;">*</span>
                    </label>
                    <select id="inlineMemberFlow" class="form-select" style="font-size: 13px; padding: 8px 12px;">
                      <option value="">请选择角色</option>
                    </select>
                  </div>

                  <div>
                    <label style="font-size: 12px; font-weight: 500; color: #1d1d1f; margin-bottom: 6px; display: block;">
                      选择模型 <span style="color: #ff3b30;">*</span>
                    </label>
                    <select id="inlineMemberModel" class="form-select" style="font-size: 13px; padding: 8px 12px;">
                      <option value="">请选择</option>
                    </select>
                  </div>

                  <div>
                    <label style="font-size: 12px; font-weight: 500; color: #1d1d1f; margin-bottom: 6px; display: block;">
                      昵称（可选）
                    </label>
                    <input type="text" id="inlineMemberName" class="form-input" placeholder="留空则使用角色名称" style="font-size: 13px; padding: 8px 12px;">
                  </div>

                  <button type="button" class="btn btn-primary" id="saveInlineMemberBtn" style="width: 100%; margin-top: 8px; font-size: 13px; padding: 10px;">
                    <span>✨</span> 创建并添加
                  </button>
                </div>
              </div>
            </div>

            <small class="form-hint">为团队添加成员，每个成员由角色、模型和昵称组成</small>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelTeamBtn">取消</button>
        <button class="btn btn-primary" id="saveTeamBtn">
          <span>✓</span> 保存
        </button>
      </div>
    </div>
  </div>

  <!-- 加载scripts -->
  <script src="../config/providers.config.js"></script>
  <script src="../utils/storage.js"></script>
  <script src="dashboard.js"></script>
  <script src="components/team-manager.js"></script>
  <script src="components/team-form.js"></script>
</body>
</html>
