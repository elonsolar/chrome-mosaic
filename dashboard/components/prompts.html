<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>提示词管理</title>
  <link rel="stylesheet" href="../../styles/dashboard.css">
  <link rel="stylesheet" href="../../styles/prompts.css">
  <style>
    body {
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="prompts-container">
    <div class="prompts-main">
      <div class="page-toolbar">
        <div class="page-toolbar-left">
          <div class="search-box">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="promptSearchInput" placeholder="搜索提示词...">
            <button class="clear-btn" id="clearPromptSearch" style="display: none;">&times;</button>
          </div>
        </div>
        <div class="page-toolbar-right">
          <button class="btn btn-primary" id="createPromptBtn">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            <span>新增提示词</span>
          </button>
          <div class="view-toggle" id="viewToggle">
            <button class="view-btn" data-view="list" title="列表视图">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <rect x="2" y="3" width="12" height="2" rx="1"/>
                <rect x="2" y="7" width="12" height="2" rx="1"/>
                <rect x="2" y="11" width="12" height="2" rx="1"/>
              </svg>
            </button>
            <button class="view-btn active" data-view="grid" title="网格视图">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
                <rect x="2" y="2" width="5" height="5" rx="1"/>
                <rect x="9" y="2" width="5" height="5" rx="1"/>
                <rect x="2" y="9" width="5" height="5" rx="1"/>
                <rect x="9" y="9" width="5" height="5" rx="1"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- 标签云 -->
      <div class="tags-cloud" id="tagsCloud" style="display: none;">
        <button class="tag-filter active" data-tag="all">全部标签</button>
      </div>

      <div class="prompts-list" id="promptsList">
        <div class="empty-state">加载中...</div>
      </div>
    </div>
  </div>

  <!-- 新建/编辑提示词对话框 -->
  <div class="modal" id="promptModal">
    <div class="modal-content modal-large">
      <div class="modal-header">
        <h2 id="promptModalTitle">新建提示词</h2>
        <button class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="promptName">提示词名称</label>
          <input type="text" id="promptName" placeholder="输入提示词名称">
        </div>

        <div class="form-group">
          <label for="promptTags">标签</label>
          <input type="text" id="promptTags" placeholder="用逗号分隔，如：javascript,代码审查">
          <small class="help-text">添加标签可以帮助您更好地组织和查找提示词</small>
        </div>

        <div class="form-group">
          <label for="promptContent">提示词内容</label>
          <textarea id="promptContent" rows="12" placeholder="输入提示词内容..."></textarea>
          <small class="help-text">清晰、准确地描述你希望 AI 完成的任务</small>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelPromptBtn">取消</button>
        <button class="btn btn-primary" id="confirmPromptBtn">创建</button>
      </div>
    </div>
  </div>

  <script src="prompts-helper.js"></script>
  <script src="../../utils/storage.js"></script>
  <script src="prompts.js"></script>
</body>
</html>
