<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>模型管理</title>
  <link rel="stylesheet" href="../../styles/sidepanel.css">
  <link rel="stylesheet" href="../../styles/models.css">
</head>
<body>
  <div class="models-container">
    <div class="models-main">
      <div class="models-header">
        <div class="models-header-left">
          <div class="models-title">
            <span class="models-icon">🤖</span>
            <h2>模型</h2>
          </div>
          <div class="models-stats">
            <span class="model-stat-badge">
              <strong id="modelCount">0</strong>
              <span>个模型</span>
            </span>
          </div>
        </div>
      </div>

      <!-- 模型列表 -->
      <div class="models-list" id="modelsList">
        <div class="empty-state">加载中...</div>
      </div>
    </div>
  </div>

  <!-- 新建/编辑模型对话框 -->
  <div class="modal" id="modelModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modelModalTitle">新建模型</h2>
        <button class="close-btn">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="modelProvider">提供商 <span class="required">*</span></label>
          <select id="modelProvider" class="form-select" required>
            <option value="">请选择提供商...</option>
          </select>
        </div>
        <div class="form-group">
          <label for="modelModel">模型标识符 <span class="required">*</span></label>
          <input type="text" id="modelModel" class="form-input" placeholder="例如: deepseek-chat" required>
        </div>
        <div class="form-group">
          <label for="modelName">显示名称 <span class="required">*</span></label>
          <input type="text" id="modelName" class="form-input" placeholder="例如: DeepSeek 聊天" required>
        </div>
        <div class="form-group">
          <label for="modelDescription">描述（可选）</label>
          <input type="text" id="modelDescription" class="form-input" placeholder="模型功能描述">
        </div>
        <div class="form-group">
          <label>访问方式</label>
          <div class="access-method-group">
            <label class="access-method-option">
              <input type="radio" name="accessMethod" value="web" checked>
              <span class="access-method-label">
                <span class="access-method-icon">🌐</span>
                <span>网页</span>
              </span>
            </label>
            <label class="access-method-option">
              <input type="radio" name="accessMethod" value="api">
              <span class="access-method-label">
                <span class="access-method-icon">⚡</span>
                <span>API</span>
              </span>
            </label>
          </div>
        </div>
        <div class="api-config-fields" id="apiConfigFields" style="display:none;">
          <div class="form-group">
            <label for="modelBaseUrl">Base URL <span class="required">*</span></label>
            <input type="text" id="modelBaseUrl" class="form-input" placeholder="https://api.deepseek.com/v1">
            <small class="form-hint">兼容 OpenAI 格式的 API 地址</small>
          </div>
          <div class="form-group">
            <label for="modelApiKey">API Key <span class="required">*</span></label>
            <div class="input-with-toggle">
              <input type="password" id="modelApiKey" class="form-input" placeholder="sk-...">
              <button type="button" class="toggle-visibility-btn" id="toggleApiKeyBtn" title="显示/隐藏">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>
        </div>
        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="modelThinking">
            <span>启用思考功能</span>
          </label>
          <small class="checkbox-hint">启用后，模型会在回复前展示思考过程</small>
        </div>
        <div class="form-group checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="modelEnabled">
            <span>启用此模型</span>
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelModelBtn">取消</button>
        <button class="btn btn-primary" id="confirmModelBtn">创建</button>
      </div>
    </div>
  </div>

  <script src="../../config/providers.config.js" defer></script>
  <script src="../../utils/storage.js" defer></script>
  <script src="model-icons.js" defer></script>
  <script src="models.js" defer></script>
</body>
</html>
