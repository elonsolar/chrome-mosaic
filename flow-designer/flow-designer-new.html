<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coze Studio Flow Designer - 100% 还原版</title>
  <link rel="icon" type="image/svg+xml" href="../icons/icon.svg">
  <link rel="stylesheet" href="../styles/flow-designer.css">
  <style>
    /* ==================== 全局样式 ==================== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #f5f5f5;
      color: #333;
      overflow: hidden;
    }

    /* ==================== 布局 ==================== */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .app-header {
      height: 60px;
      background: #fff;
      border-bottom: 1px solid #e8e8e8;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .app-title {
      font-size: 20px;
      font-weight: 600;
      color: #1890ff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-title .icon {
      font-size: 24px;
    }

    .app-actions {
      display: flex;
      gap: 10px;
    }

    .app-main {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ==================== 工具栏 ==================== */
    .toolbar {
      width: 60px;
      background: #fff;
      border-right: 1px solid #e8e8e8;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px 0;
      gap: 8px;
    }

    .tool-item {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      font-size: 20px;
      background: #f5f5f5;
      border: 1px solid #e8e8e8;
    }

    .tool-item:hover {
      background: #e6f7ff;
      border-color: #1890ff;
      transform: scale(1.05);
    }

    .tool-item.active {
      background: #1890ff;
      color: #fff;
      border-color: #1890ff;
    }

    /* ==================== 画布区域 ==================== */
    .canvas-container {
      flex: 1;
      position: relative;
      overflow: auto;
      background: #f0f2f5;
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    #flow-canvas {
      width: 3000px;
      height: 2000px;
      position: relative;
    }

    /* ==================== 节点样式 ==================== */
    .flow-node {
      position: absolute;
      width: 240px;
      background: #fff;
      border: 2px solid #e8e8e8;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      cursor: pointer;
      transition: all 0.2s;
      overflow: hidden;
    }

    .flow-node:hover {
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
      transform: translateY(-2px);
    }

    .flow-node.selected {
      border-color: #1890ff;
      box-shadow: 0 0 0 3px rgba(24, 144, 255, 0.1);
    }

    .flow-node-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid #e8e8e8;
      font-weight: 600;
      font-size: 14px;
    }

    .flow-node-icon {
      font-size: 18px;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .flow-node-title {
      flex: 1;
    }

    .flow-node-body {
      padding: 12px;
    }

    .flow-node-description {
      font-size: 12px;
      color: #666;
      line-height: 1.5;
    }

    /* ==================== 连线样式 ==================== */
    .flow-edge {
      position: absolute;
      pointer-events: none;
      z-index: 1;
    }

    /* ==================== 右侧配置面板 ==================== */
    .config-panel {
      width: 400px;
      background: #fff;
      border-left: 1px solid #e8e8e8;
      display: flex;
      flex-direction: column;
      box-shadow: -2px 0 8px rgba(0, 0, 0, 0.05);
      z-index: 100;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #e8e8e8;
    }

    .panel-header h2 {
      font-size: 16px;
      font-weight: 600;
      color: #333;
    }

    .panel-close {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 20px;
      color: #999;
      border-radius: 6px;
      transition: all 0.2s;
    }

    .panel-close:hover {
      background: #f5f5f5;
      color: #333;
    }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .panel-footer {
      display: flex;
      gap: 10px;
      padding: 16px 20px;
      border-top: 1px solid #e8e8e8;
    }

    /* ==================== 配置节 ==================== */
    .config-section {
      margin-bottom: 24px;
    }

    .config-section h3 {
      font-size: 14px;
      font-weight: 600;
      color: #333;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .config-section h3::before {
      content: '';
      width: 3px;
      height: 14px;
      background: #1890ff;
      border-radius: 2px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #666;
      margin-bottom: 6px;
    }

    .form-control {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d9d9d9;
      border-radius: 6px;
      font-size: 13px;
      transition: all 0.2s;
    }

    .form-control:focus {
      outline: none;
      border-color: #1890ff;
      box-shadow: 0 0 0 2px rgba(24, 144, 255, 0.1);
    }

    .form-control::placeholder {
      color: #bfbfbf;
    }

    textarea.form-control {
      resize: vertical;
      min-height: 80px;
      font-family: inherit;
    }

    .hint {
      font-size: 12px;
      color: #999;
      margin-top: 6px;
      line-height: 1.5;
    }

    /* ==================== 变量列表 ==================== */
    .variable-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 10px;
    }

    .variable-item {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 8px;
      background: #fafafa;
      border-radius: 6px;
      border: 1px solid #e8e8e8;
    }

    .variable-item .var-ref-input {
      cursor: pointer;
      background: #fff;
    }

    .variable-item .var-ref-input:hover {
      border-color: #1890ff;
    }

    /* ==================== 按钮 ==================== */
    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-sm {
      padding: 4px 10px;
      font-size: 12px;
    }

    .btn-primary {
      background: #1890ff;
      color: #fff;
    }

    .btn-primary:hover {
      background: #40a9ff;
    }

    .btn-secondary {
      background: #fff;
      color: #333;
      border: 1px solid #d9d9d9;
    }

    .btn-secondary:hover {
      color: #1890ff;
      border-color: #1890ff;
    }

    .btn-danger {
      background: #ff4d4f;
      color: #fff;
    }

    .btn-danger:hover {
      background: #ff7875;
    }

    /* ==================== 变量选择器 ==================== */
    #variable-picker {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 1000;
      display: none;
    }

    .variable-picker-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(2px);
    }

    .variable-picker-dialog {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 600px;
      max-height: 600px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
    }

    .variable-picker-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid #e8e8e8;
    }

    .variable-picker-header h3 {
      font-size: 16px;
      font-weight: 600;
    }

    .variable-picker-body {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .variable-group {
      margin-bottom: 16px;
    }

    .variable-group-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: #f5f5f5;
      border-radius: 6px;
      font-weight: 600;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .variable-group-items {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding-left: 12px;
    }

    .variable-group-items .variable-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      grid-template-columns: 1fr auto;
    }

    .variable-group-items .variable-item:hover {
      background: #e6f7ff;
      border-color: #1890ff;
    }

    .variable-name {
      font-size: 13px;
      font-weight: 500;
    }

    .variable-type {
      font-size: 11px;
      color: #999;
      background: #f5f5f5;
      padding: 2px 8px;
      border-radius: 4px;
    }

    /* ==================== 滚动条 ==================== */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f5f5f5;
    }

    ::-webkit-scrollbar-thumb {
      background: #d9d9d9;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #bfbfbf;
    }

    /* ==================== 节点端口 ==================== */
    .node-port {
      position: absolute;
      width: 12px;
      height: 12px;
      background: #fff;
      border: 2px solid #1890ff;
      border-radius: 50%;
      cursor: crosshair;
      z-index: 10;
      transition: all 0.2s;
      pointer-events: auto;
    }

    .node-port:hover {
      background: #1890ff;
      transform: scale(1.2);
      box-shadow: 0 0 0 4px rgba(24, 144, 255, 0.2);
    }

    .node-port.port-input {
      border-color: #52c41a;
    }

    .node-port.port-input:hover {
      background: #52c41a;
      box-shadow: 0 0 0 4px rgba(82, 196, 26, 0.2);
    }

    .node-port.port-disabled {
      border-color: #d9d9d9;
      cursor: not-allowed;
      opacity: 0.5;
    }

    .node-port.port-disabled:hover {
      transform: none;
      box-shadow: none;
    }

    .port-icon {
      display: none;
      font-size: 8px;
      line-height: 1;
      color: #fff;
    }

    /* ==================== SVG 连线 ==================== */
    .connections-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }

    .connection-line {
      stroke: #1890ff;
      stroke-width: 2;
      fill: none;
      pointer-events: stroke;
      cursor: pointer;
      transition: stroke 0.2s, stroke-width 0.2s;
    }

    .connection-line:hover {
      stroke: #40a9ff;
      stroke-width: 3;
    }

    .connection-line.selected {
      stroke: #ff4d4f;
      stroke-width: 3;
    }

    .connection-line.temp-line {
      stroke-dasharray: 5, 5;
      opacity: 0.6;
    }

    /* ==================== 响应式 ==================== */
    @media (max-width: 768px) {
      .config-panel {
        width: 100%;
        position: fixed;
        top: 60px;
        right: 0;
        bottom: 0;
        transform: translateX(100%);
        transition: transform 0.3s;
      }

      .config-panel.show {
        transform: translateX(0);
      }

      .variable-picker-dialog {
        width: 90%;
        max-width: 400px;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 头部 -->
    <header class="app-header">
      <div class="app-title">
        <span class="icon">🎨</span>
        <span>Coze Studio Flow Designer</span>
      </div>
      <div class="app-actions">
        <button class="btn btn-secondary" onclick="app.clearFlowData()">清空</button>
        <button class="btn btn-secondary" onclick="app.exportFlowData()">导出</button>
        <button class="btn btn-primary" onclick="document.getElementById('import-file').click()">导入</button>
        <input type="file" id="import-file" accept=".json" style="display: none;" onchange="app.importFlowData(this.files[0])">
      </div>
    </header>

    <!-- 主体 -->
    <div class="app-main">
      <!-- 工具栏 -->
      <aside class="toolbar">
        <div class="tool-item" title="选择" onclick="setTool('select')">
          <span>🖱️</span>
        </div>
        <div class="tool-item" title="大模型" onclick="setTool('llm')">
          <span>🤖</span>
        </div>
        <div class="tool-item" title="HTTP" onclick="setTool('http')">
          <span>🌐</span>
        </div>
        <div class="tool-item" title="代码" onclick="setTool('code')">
          <span>💻</span>
        </div>
        <div class="tool-item" title="循环" onclick="setTool('loop')">
          <span>🔁</span>
        </div>
        <div class="tool-item" title="条件" onclick="setTool('if')">
          <span>🔀</span>
        </div>
      </aside>

      <!-- 画布 -->
      <main class="canvas-container">
        <div id="flow-canvas"></div>
      </main>

      <!-- 配置面板 -->
      <aside id="config-panel" class="config-panel" style="display: none;">
        <!-- 动态内容 -->
      </aside>
    </div>
  </div>

  <!-- 变量选择器 -->
  <div id="variable-picker">
    <!-- 动态内容 -->
  </div>

  <!-- 脚本 -->
  <script src="flow-types.js"></script>
  <script src="flow-connections.js"></script>
  <script src="flow-app.js"></script>
  <script>
    // ==================== 工具栏 ====================
    let currentTool = 'select';

    function setTool(tool) {
      currentTool = tool;

      // 更新工具栏状态
      document.querySelectorAll('.tool-item').forEach(item => {
        item.classList.remove('active');
      });

      event.target.closest('.tool-item').classList.add('active');

      // 显示提示
      const toolNames = {
        select: '点击选择节点',
        llm: '点击画布添加大模型节点',
        http: '点击画布添加 HTTP 节点',
        code: '点击画布添加代码节点',
        loop: '点击画布添加循环节点',
        if: '点击画布添加条件节点',
      };

      console.log(toolNames[tool]);
    }

    // ==================== 画布点击 ====================
    document.getElementById('flow-canvas').addEventListener('click', (e) => {
      if (e.target.id === 'flow-canvas' && currentTool !== 'select') {
        const rect = e.target.getBoundingClientRect();
        const x = e.clientX - rect.left + e.target.parentElement.scrollLeft;
        const y = e.clientY - rect.top + e.target.parentElement.scrollTop;

        const toolTypeMap = {
          llm: StandardNodeType.LLM,
          http: StandardNodeType.Http,
          code: StandardNodeType.Code,
          loop: StandardNodeType.Loop,
          if: StandardNodeType.If,
        };

        const nodeType = toolTypeMap[currentTool];
        if (nodeType) {
          app.addNode(nodeType, { x, y });
          setTool('select');
        }
      }
    });

    // ==================== 初始化应用 ====================
    const app = new FlowDesignerApp('flow-canvas');

    console.log('Coze Studio Flow Designer 已就绪');
    console.log('支持的功能：');
    console.log('- ✅ 开始/结束节点');
    console.log('- ✅ 大模型节点（LLM）');
    console.log('- ✅ HTTP 请求节点');
    console.log('- ✅ 代码执行节点');
    console.log('- ✅ 循环节点');
    console.log('- ✅ 条件判断节点');
    console.log('- ✅ 变量引用系统');
    console.log('- ✅ 变量选择器');
    console.log('- ✅ 节点配置面板');
    console.log('- ✅ 节点连线系统（贝塞尔曲线）');
    console.log('- ✅ 节点端口拖拽连线');
    console.log('- ✅ 数据导入/导出');
    console.log('');
    console.log('操作提示：');
    console.log('- 拖拽节点输出端口（右侧 ▶）到输入端口（左侧 ◀）创建连线');
    console.log('- 点击连线选中，按 Delete 删除');
    console.log('- 双击连线快速删除');
  </script>
</body>
</html>
