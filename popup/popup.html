<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mosaic</title>
  <style>
    :root {
      /* 色彩系统 - 极简专业 */
      --bg-primary: #ffffff;
      --bg-secondary: #f8f9fa;
      --bg-tertiary: #e9ecef;
      --text-primary: #212529;
      --text-secondary: #495057;
      --text-muted: #6c757d;
      --accent: #0d6efd;
      --accent-hover: #0b5ed7;
      --border: #dee2e6;
      --border-light: #e9ecef;
      
      /* 圆角 - 极度克制 */
      --radius-sm: 4px;
      --radius-md: 6px;
      --radius-lg: 8px;
      
      /* 间距 - 4px 基准 */
      --space-2xs: 2px;
      --space-xs: 4px;
      --space-sm: 8px;
      --space-md: 12px;
      --space-lg: 16px;
      --space-xl: 24px;
      
      /* 字体 */
      --font-sans: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'IBM Plex Mono', 'SF Mono', 'JetBrains Mono', monospace;
      
      /* 过渡 */
      --transition-fast: 100ms ease;
      --transition-base: 200ms ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 360px;
      min-height: 480px;
      font-family: var(--font-sans);
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-primary);
      background-color: var(--bg-primary);
      overflow-x: hidden;
    }

    .container {
      padding: var(--space-lg);
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .header {
      flex-shrink: 0;
      margin-bottom: var(--space-lg);
      text-align: center;
    }

    .logo {
      width: 48px;
      height: 48px;
      margin: 0 auto var(--space-sm);
      background: linear-gradient(135deg, var(--accent), var(--accent-hover));
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo svg {
      width: 24px;
      height: 24px;
    }

    .title {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.5px;
      margin-bottom: var(--space-2xs);
    }

    .tagline {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .divider {
      height: 1px;
      background: var(--border-light);
      margin: var(--space-lg) 0;
    }

    .platforms {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-xs);
      justify-content: center;
      margin-bottom: var(--space-lg);
    }

    .platform-badge {
      padding: var(--space-2xs) var(--space-sm);
      background: var(--bg-tertiary);
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .quick-actions {
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      margin-bottom: var(--space-lg);
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-sm);
      padding: var(--space-sm) var(--space-lg);
      font-size: 13px;
      font-weight: 500;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all var(--transition-base);
      text-decoration: none;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: transparent;
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      background: var(--bg-tertiary);
      transform: translateY(-1px);
    }

    .btn-icon {
      font-size: 16px;
    }

    .tips-section {
      margin-top: auto;
      padding-top: var(--space-lg);
      border-top: 1px solid var(--border-light);
    }

    .tips-title {
      display: flex;
      align-items: center;
      gap: var(--space-sm);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: var(--space-sm);
    }

    .tips-icon {
      font-size: 14px;
    }

    .tips-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .tips-item {
      display: flex;
      align-items: flex-start;
      gap: var(--space-sm);
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
      margin-bottom: var(--space-xs);
    }

    .tips-item:last-child {
      margin-bottom: 0;
    }

    .tips-number {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      background: var(--accent);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 600;
      flex-shrink: 0;
    }

    .status-bar {
      padding-top: var(--space-sm);
      border-top: 1px solid var(--border-light);
      font-size: 12px;
      color: var(--text-muted);
      text-align: center;
    }

    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      margin-right: var(--space-xs);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    .footer {
      margin-top: auto;
      padding-top: var(--space-sm);
      border-top: 1px solid var(--border-light);
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
    }

    .footer-link {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .footer-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M4 6h16M4 12h16M4 18h10" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 class="title">Mosaic</h1>
      <p class="tagline">多平台 AI 模型协作工具</p>
    </div>

    <div class="divider"></div>

    <div class="platforms">
      <span class="platform-badge">DeepSeek</span>
      <span class="platform-badge">豆包</span>
      <span class="platform-badge">千问</span>
      <span class="platform-badge">Kimi</span>
    </div>

    <div class="content">
      <div class="quick-actions">
        <button class="btn btn-primary" id="openSidePanelBtn">
          <span class="btn-icon">📱</span>
          <span>打开侧边栏</span>
        </button>
        <button class="btn btn-secondary" id="openDashboardBtn">
          <span class="btn-icon">📊</span>
          <span>管理面板</span>
        </button>
        <button class="btn btn-secondary" id="newChatBtn">
          <span class="btn-icon">💬</span>
          <span>快速新建对话</span>
        </button>
      </div>

      <div class="tips-section">
        <div class="tips-title">
          <span class="tips-icon">⚡</span>
          <span>快速开始</span>
        </div>
        <ul class="tips-list">
          <li class="tips-item">
            <span class="tips-number">1</span>
            <span>先登录AI网站（如DeepSeek）</span>
          </li>
          <li class="tips-item">
            <span class="tips-number">2</span>
            <span>在侧边栏创建角色并测试</span>
          </li>
          <li class="tips-item">
            <span class="tips-number">3</span>
            <span>创建会话并选择角色</span>
          </li>
          <li class="tips-item">
            <span class="tips-number">4</span>
            <span>开始对话，享受多模型AI体验</span>
          </li>
        </ul>
      </div>

      <div class="status-bar" id="status">
        <span class="status-dot"></span>
        <span>就绪</span>
      </div>
    </div>

    <div class="footer">
      <p class="footer-text">
        Made with ❤️ · <a href="https://github.com/elonsolar/free-ai" class="footer-link" target="_blank">GitHub</a>
      </p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
