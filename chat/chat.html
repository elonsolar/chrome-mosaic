<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mosaic</title>
  <link rel="icon" type="image/svg+xml" href="../icons/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles/chat.css">
  <!-- KaTeX 数学公式渲染 -->
  <link rel="stylesheet" href="../libs/katex.min.css">
  <script src="../libs/katex.min.js"></script>
</head>
<body>
  <div class="chat-layout">
    <!-- 左侧会话侧边栏 - 参考 DeepSeek Chat 风格 -->
    <aside class="conversation-sidebar" id="conversationSidebar">
      <div class="sidebar-top">
        <div class="sidebar-brand">
          <div class="sidebar-logo">
            <svg class="sidebar-logo-icon" width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <linearGradient id="grad1-sm-chat" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
                  <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
                </linearGradient>
                <linearGradient id="grad2-sm-chat" x1="100%" y1="0%" x2="0%" y2="100%">
                  <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
                  <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
                </linearGradient>
              </defs>
              <rect width="22" height="22" rx="6" fill="#1a1a2e"/>
              <rect x="2" y="2" width="8" height="8" rx="2" fill="url(#grad1-sm-chat)"/>
              <rect x="12" y="2" width="8" height="8" rx="2" fill="url(#grad2-sm-chat)"/>
              <rect x="2" y="12" width="8" height="8" rx="2" fill="#4facfe"/>
              <rect x="12" y="12" width="8" height="8" rx="2" fill="#43e97b"/>
              <path d="M11 5C11 5 12 10 15.5 11C12 12 11 17 11 17C11 17 10 12 6.5 11C10 10 11 5 11 5Z" fill="white" opacity="0.9"/>
            </svg>
            <span class="sidebar-logo-text">Mosaic</span>
          </div>
          <div class="sidebar-top-actions">
            <button class="sidebar-icon-btn" id="sidebarSearchToggle" title="搜索会话">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M11.894845 6.647401C11.894845 3.725463 9.534486 1.356779 6.623219 1.35657C3.711786 1.35657 1.351635 3.725338 1.351635 6.647401C1.351843 9.569296 3.711911 11.938273 6.623219 11.938273C9.534361 11.938064 11.894637 9.569171 11.894845 6.647401ZM13.245462 6.647401C13.245254 10.317935 10.280401 13.293613 6.623219 13.293821C2.965871 13.293821 0.000204 10.31806 0 6.647401C0 2.976574 2.965746 0 6.623219 0C10.280526 0.000205 13.245462 2.9767 13.245462 6.647401Z" fill="currentColor"></path><path d="M16.000417 15.041079L15.044449 16.000433L11.530434 12.473588L12.486298 11.514234L16.000417 15.041079Z" fill="currentColor"></path></svg>
            </button>
            <button class="sidebar-icon-btn" id="sidebarCollapseBtn" title="收起侧边栏">

            </button>
          </div>
        </div>
      </div>

      <div class="sidebar-new-chat">
        <button class="new-chat-btn" id="newChatBtn" title="新建会话 (Ctrl+J)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M8 0.599609C3.91309 0.599609 0.599609 3.91309 0.599609 8C0.599609 9.13376 0.855461 10.2098 1.3125 11.1719L1.5918 11.7588L2.76562 11.2012L2.48633 10.6143C2.11034 9.82278 1.90039 8.93675 1.90039 8C1.90039 4.63106 4.63106 1.90039 8 1.90039C11.3689 1.90039 14.0996 4.63106 14.0996 8C14.0996 11.3689 11.3689 14.0996 8 14.0996C7.31041 14.0996 6.80528 14.0514 6.35742 13.9277C5.91623 13.8059 5.49768 13.6021 4.99707 13.2529C4.26492 12.7422 3.21611 12.5616 2.35156 13.1074L2.33789 13.1162L2.32422 13.126L1.58789 13.6436L2.01953 14.9297L3.0459 14.207C3.36351 14.0065 3.83838 14.0294 4.25293 14.3184C4.84547 14.7317 5.39743 15.011 6.01172 15.1807C6.61947 15.3485 7.25549 15.4004 8 15.4004C12.0869 15.4004 15.4004 12.0869 15.4004 8C15.4004 3.91309 12.0869 0.599609 8 0.599609ZM7.34473 4.93945V7.34961H4.93945V8.65039H7.34473V11.0605H8.64551V8.65039H11.0605V7.34961H8.64551V4.93945H7.34473Z" fill="currentColor"></path></svg>
          <span>开启新对话</span>
        </button>
      </div>

      <div class="sidebar-conversations" id="sidebarConversations">
        <div class="sidebar-loading">加载中...</div>
      </div>

      <div class="sidebar-footer">
        <button class="sidebar-footer-btn" id="openDashboardBtn" title="管理">
          <div class="sidebar-footer-avatar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="3" width="8" height="8" rx="2" stroke="currentColor" stroke-width="2"/>
              <rect x="13" y="3" width="8" height="8" rx="2" stroke="currentColor" stroke-width="2"/>
              <rect x="3" y="13" width="8" height="8" rx="2" stroke="currentColor" stroke-width="2"/>
              <rect x="13" y="13" width="8" height="8" rx="2" stroke="currentColor" stroke-width="2"/>
            </svg>
          </div>
          <span class="sidebar-footer-name">管理</span>
        </button>
      </div>
    </aside>

    <!-- 主聊天区域 -->
    <div class="chat-container">
      <!-- 顶部信息栏 -->
      <div class="chat-header">
        <button class="sidebar-toggle" id="sidebarToggle" title="展开侧边栏" style="display:none;">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <div class="chat-header-right">
          <span class="mode-badge" id="modeBadge" title="点击切换发送模式"></span>
          <div class="members-tags-wrapper">
            <div class="members-tags" id="membersTags"></div>
            <button class="member-add-btn" id="memberAddBtn" title="添加成员（支持选择现有或创建新成员）">+</button>
          </div>
        </div>
        <div class="chat-header-actions">
          <button class="header-icon-btn" id="themeToggleBtn" title="切换主题">
            <svg class="theme-icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="5" stroke="currentColor" stroke-width="2"/>
              <path d="M12 2V4M12 20V22M4.22 4.22L5.64 5.64M18.36 18.36L19.78 19.78M2 12H4M20 12H22M4.22 19.78L5.64 18.36M18.36 5.64L19.78 4.22" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
            <svg class="theme-icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none;">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- 消息列表 -->
      <div class="messages-container" id="messagesContainer"></div>

      <!-- 固定进度指示器（位于输入框上方） -->
      <div class="loop-progress-fixed" id="loopProgressFixed"></div>

      <!-- 输入区域 -->
      <div class="input-container">
        <div class="input-wrapper">

          <textarea id="messageInput" placeholder="输入消息，按 Enter 发送..." rows="1"></textarea>
          <div class="input-actions">
            <button class="send-btn" id="sendBtn" disabled>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- 右侧智能面板 -->
    <div class="smart-panel collapsed" id="smartPanel">
      <button class="smart-panel-toggle" id="smartPanelToggle" title="展开智能面板">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <div class="smart-panel-content">
        <div class="smart-panel-tabs">
          <button class="smart-panel-tab active" data-tab="members">成员</button>
          <button class="smart-panel-tab" data-tab="history">历史</button>
          <button class="smart-panel-tab" data-tab="files">文件</button>
        </div>
        <div class="smart-panel-body">
          <div class="smart-panel-tab-content active" id="smartPanelMembers"></div>
          <div class="smart-panel-tab-content" id="smartPanelHistory"></div>
          <div class="smart-panel-tab-content" id="smartPanelFiles"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 新建会话模态框 -->
  <div class="modal-overlay" id="newConversationModal">
    <div class="modal-content" style="max-width: 600px;">
      <div class="modal-header">
        <h2 id="convModalTitle">新建会话</h2>
        <button class="modal-close" id="closeConvModalBtn">&times;</button>
      </div>
      <div class="modal-body">
        <form id="newConvForm">
          <div class="form-group">
            <label for="convNameInput">会话名称</label>
            <input type="text" id="convNameInput" class="form-input" placeholder="输入会话名称（可选）" autocomplete="off">
            <small class="form-hint">留空则自动生成标题</small>
          </div>

          <div class="form-group">
            <div class="form-label">对话模式</div>
            <div class="mode-selector" id="convModeSelector">
              <label class="mode-option">
                <input type="radio" name="convMode" value="brainstorming" checked>
                <div class="mode-card">
                  <div class="mode-icon">💡</div>
                  <div class="mode-title">头脑风暴</div>
                  <div class="mode-desc">独享上下文 · 并行回复</div>
                </div>
              </label>
              <label class="mode-option">
                <input type="radio" name="convMode" value="discussion">
                <div class="mode-card">
                  <div class="mode-icon">🪑</div>
                  <div class="mode-title">圆桌讨论</div>
                  <div class="mode-desc">共享上下文 · 依次发言</div>
                </div>
              </label>
              <label class="mode-option">
                <input type="radio" name="convMode" value="expertqa">
                <div class="mode-card">
                  <div class="mode-icon">🎓</div>
                  <div class="mode-title">专家问答</div>
                  <div class="mode-desc">多AI协作 · 迭代求解</div>
                </div>
              </label>
            </div>
          </div>

          <div class="form-group" id="expertSelectGroup" style="display:none;">
            <div class="form-label">选择专家</div>
            <div class="expert-selector" id="expertSelector">
              <div class="empty-state">加载中...</div>
            </div>
          </div>

          <div class="form-group" id="memberGroup">
            <div class="form-label">成员数量 <span style="color: #ff3b30;">*</span></div>
            <div style="display: flex; align-items: center; gap: 12px;">
              <input type="range" id="memberCountSlider" class="slider" min="1" max="6" value="3" style="flex: 1;">
              <div style="background: #f5f5f7; padding: 8px 16px; border-radius: 8px; min-width: 60px; text-align: center; font-weight: 600; color: #1d1d1f;">
                <span id="memberCountValue">3</span> 人
              </div>
            </div>
            <small class="form-hint">系统将自动生成成员并分配随机昵称和默认模型</small>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelConvBtn">取消</button>
        <button class="btn btn-primary" id="confirmConvBtn">
          <span>💬</span> 开始对话
        </button>
      </div>
    </div>
  </div>

      <span>导出会话</span>
    </div>

  <!-- 成员对话历史弹出框 -->
  <div class="member-chat-overlay" id="memberChatOverlay">
    <div class="member-chat-modal">
      <div class="member-chat-header">
        <div class="member-chat-title">
          <span class="member-chat-avatar" id="memberChatAvatar"></span>
          <span id="memberChatName">成员对话</span>
        </div>
        <button class="member-chat-close" id="memberChatClose">&times;</button>
      </div>
      <div class="member-chat-messages" id="memberChatMessages">
        <div class="member-chat-empty">暂无对话记录</div>
      </div>
    </div>
  </div>

  <!-- 成员配置模态框 -->
  <div class="modal-overlay" id="memberConfigModal">
    <div class="modal-content" style="max-width: 500px;">
      <div class="modal-header">
        <h2 id="memberConfigModalTitle">配置成员</h2>
        <button class="modal-close" id="closeMemberConfigBtn">&times;</button>
      </div>
      <div class="modal-body">
        <form id="memberConfigForm">
          <div class="form-group">
            <label for="memberConfigName">成员名称</label>
            <input type="text" id="memberConfigName" class="form-input" placeholder="成员名称" autocomplete="off">
          </div>
          <div class="form-group">
            <label for="memberConfigModel">选择模型</label>
            <select id="memberConfigModel" class="form-select">
              <option value="">请选择模型...</option>
            </select>
          </div>
          <div class="form-group">
            <label for="memberConfigPrompt">选择提示词 <span class="optional">(可选)</span></label>
            <select id="memberConfigPrompt" class="form-select">
              <option value="">无提示词</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="cancelMemberConfigBtn">取消</button>
        <button class="btn btn-primary" id="saveMemberConfigBtn">
          <span>✓</span> 保存
        </button>
      </div>
    </div>
  </div>

  <!-- 会话信息侧边栏 -->
  <div class="conversation-info-sidebar" id="conversationInfoSidebar">
    <div class="conversation-info-header">
      <h2>会话信息</h2>
      <button class="conversation-info-close" id="conversationInfoClose">&times;</button>
    </div>
    <div class="conversation-info-content">
      <div class="conversation-info-section">
        <h3>成员 (<span id="memberCount">0</span>)</h3>
        <div class="conversation-members-list" id="conversationMembersList">
        </div>
        <div class="add-member-card" id="addMemberBtn" title="添加成员">
          <div class="add-member-avatar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
          </div>
          <div class="add-member-info">
            <div class="add-member-name">添加成员</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="search-modal-overlay" id="searchModalOverlay">
    <div class="search-modal" id="searchModal">
      <div class="search-modal-input-row">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M11.894845 6.647401C11.894845 3.725463 9.534486 1.356779 6.623219 1.35657C3.711786 1.35657 1.351635 3.725338 1.351635 6.647401C1.351843 9.569296 3.711911 11.938273 6.623219 11.938273C9.534361 11.938064 11.894637 9.569171 11.894845 6.647401ZM13.245462 6.647401C13.245254 10.317935 10.280401 13.293613 6.623219 13.293821C2.965871 13.293821 0.000204 10.31806 0 6.647401C0 2.976574 2.965746 0 6.623219 0C10.280526 0.000205 13.245462 2.9767 13.245462 6.647401Z" fill="currentColor"></path><path d="M16.000417 15.041079L15.044449 16.000433L11.530434 12.473588L12.486298 11.514234L16.000417 15.041079Z" fill="currentColor"></path></svg>

  </div>

  <!-- 批量删除会话模态框 -->
  <div class="modal-overlay" id="batchDeleteModal">
    <div class="modal-content" style="max-width: 650px; max-height: 80vh; display: flex; flex-direction: column;">
      <div class="modal-header">
        <h2>批量删除会话</h2>
        <button class="modal-close" id="closeBatchDeleteModalBtn">&times;</button>
      </div>
      <div class="modal-body" style="flex: 1; overflow: hidden; display: flex; flex-direction: column;">
        <!-- 筛选区域 -->
        <div class="batch-delete-filters">
          <div class="filter-row">
            <div class="filter-group">
              <label>会话名称</label>
              <input type="text" id="batchFilterName" class="form-input" placeholder="搜索会话名称...">
            </div>
            <div class="filter-group">
              <label>对话模式</label>
              <select id="batchFilterMode" class="form-select">
                <option value="">全部模式</option>
                <option value="brainstorming">头脑风暴</option>
                <option value="discussion">圆桌讨论</option>
                <option value="expertqa">专家问答</option>
              </select>
            </div>
          </div>
          <div class="filter-row">
            <div class="filter-group">
              <label>开始日期</label>
              <input type="date" id="batchFilterDateFrom" class="form-input">
            </div>
            <div class="filter-group">
              <label>结束日期</label>
              <input type="date" id="batchFilterDateTo" class="form-input">
            </div>
          </div>
        </div>
        <!-- 会话列表 -->
        <div class="batch-delete-list-header">
          <label class="batch-select-all">
            <input type="checkbox" id="batchSelectAll">
            <span>全选</span>
